name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compute build number
        id: ver
        run: echo "vc=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SqueveRedail.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SqueveRedail-apk
          path: SqueveRedail.apk

      # Every successful build on main becomes the "latest" release the app updates from.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.ver.outputs.vc }}
          name: Squeve Redail build ${{ steps.ver.outputs.vc }}
          target_commitish: ${{ github.sha }}
          files: SqueveRedail.apk
          make_latest: "true"
